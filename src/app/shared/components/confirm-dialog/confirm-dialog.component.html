<app-dialog
  [isOpen]="isOpen()"
  [title]="title()"
  size="sm"
  [closeOnBackdrop]="!isProcessing()"
  (closed)="onCancel()"
>
  <div class="confirm-body">
    <p class="confirm-message">{{ message() }}</p>
  </div>

  <div dialog-actions class="confirm-actions">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="onCancel()"
      [disabled]="isProcessing()"
    >
      {{ cancelText() }}
    </button>
    <button
      type="button"
      class="btn"
      [class.btn-danger]="isDestructive()"
      [class.btn-primary]="!isDestructive()"
      (click)="onConfirm()"
      [disabled]="isProcessing()"
    >
      @if (isProcessing()) {
        <span class="btn-spinner" aria-hidden="true"></span>
        Processing...
      } @else {
        {{ confirmText() }}
      }
    </button>
  </div>
</app-dialog>
